name: OmniLabel AI — Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Backend Test Suite & Cryptographic Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Automated Pytest Suite
        run: |
          pytest -v --junitxml=reports/junit.xml

      - name: Verify Cryptographic Hash Chain Integrity
        run: |
          python -c "from src.audit import AuditLedger; audit = AuditLedger('test.db'); audit.append_event('EVT-1', 'CI', 'System', 'TEST', 'BUILD', '001', {}); ok, msg = audit.verify_integrity(); assert ok, msg; print('CI SHA-256 Hash Chain Integrity Verified')"

      - name: Upload Test Evidence Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regulatory-evidence-package
          path: evidence/

  build-frontend:
    name: React Frontend Build & Asset Verification
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Production Web Bundle
        working-directory: ./frontend
        run: npm run build

      - name: Upload Production Web Bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
