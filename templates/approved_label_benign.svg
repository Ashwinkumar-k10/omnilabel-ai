<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" style="background:#ffffff; font-family:Arial, Helvetica, sans-serif;">
  <!-- Label Border & Background -->
  <rect x="10" y="10" width="780" height="480" rx="8" ry="8" fill="#ffffff" stroke="#2c3e50" stroke-width="3"/>
  <rect x="15" y="15" width="770" height="470" rx="5" ry="5" fill="none" stroke="#bdc3c7" stroke-width="1"/>

  <!-- Unapproved Draft Watermark / Banner if applicable -->
  {% if is_draft %}
  <g id="draft_watermark">
    <rect x="20" y="20" width="760" height="36" fill="#e74c3c" opacity="0.92" rx="4"/>
    <text x="400" y="44" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="2">
      CONTROLLED DRAFT — NOT APPROVED FOR CLINICAL USE / PRODUCTION
    </text>
  </g>
  {% endif %}

  <!-- Header Section: Logo shifted by +5px (Harmless aesthetic shift) -->
  <g id="header_section" transform="translate(30, {% if is_draft %}75{% else %}40{% endif %})">
    <!-- Brand Mark (Logo) shifted by 5px -->
    <g id="brand_logo" transform="translate(5, 0)">
      <circle cx="28" cy="28" r="24" fill="#16a085"/>
      <path d="M18 28 L25 35 L38 20" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      <text x="62" y="26" fill="#16a085" font-size="18" font-weight="bold">CARDIOVASC</text>
      <text x="62" y="42" fill="#7f8c8d" font-size="12" letter-spacing="1">SURGICAL TECHNOLOGIES</text>
    </g>

    <!-- Product Title & Device Classification -->
    <text x="350" y="28" fill="#2c3e50" font-size="22" font-weight="bold">{{ product_name }}</text>
    <text x="350" y="48" fill="#34495e" font-size="14">{{ variant_name }}</text>
  </g>

  <!-- Horizontal Divider -->
  <line x1="30" y1="{% if is_draft %}145{% else %}110{% endif %}" x2="770" y2="{% if is_draft %}145{% else %}110{% endif %}" stroke="#2c3e50" stroke-width="2"/>

  <!-- Main Information Grid -->
  <g id="info_grid" transform="translate(30, {% if is_draft %}165{% else %}130{% endif %})">
    
    <!-- Left Column: Regulated Medical Symbols and Parameters -->
    <g id="col_left">
      <!-- Expiry Date with Symbol -->
      <g id="shelf_life_box">
        <rect x="0" y="0" width="350" height="54" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1" rx="4"/>
        <text x="15" y="34" font-size="22" fill="#2c3e50">⌛</text>
        <text x="45" y="22" font-size="11" font-weight="bold" fill="#7f8c8d">STERILE SHELF LIFE / USE-BY DATE</text>
        <text x="45" y="44" font-size="16" font-weight="bold" fill="#2c3e50" id="field_shelf_life">{{ shelf_life_text }} (USE BY: {{ expiry_date }})</text>
      </g>

      <!-- Manufacturing Date & Lot Number -->
      <g id="mfg_lot_box" transform="translate(0, 64)">
        <rect x="0" y="0" width="350" height="54" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1" rx="4"/>
        <text x="15" y="34" font-size="18" fill="#2c3e50">🏭</text>
        <text x="45" y="22" font-size="11" font-weight="bold" fill="#7f8c8d">MANUFACTURE DATE &amp; LOT</text>
        <text x="45" y="44" font-size="14" font-weight="bold" fill="#2c3e50">MFG: {{ mfg_date }} | LOT: {{ lot_number }}</text>
      </g>

      <!-- Storage Conditions -->
      <g id="storage_box" transform="translate(0, 128)">
        <rect x="0" y="0" width="350" height="54" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1" rx="4"/>
        <text x="15" y="34" font-size="20" fill="#2c3e50">🌡️</text>
        <text x="45" y="22" font-size="11" font-weight="bold" fill="#7f8c8d">STORAGE TEMPERATURE</text>
        <text x="45" y="44" font-size="13" font-weight="bold" fill="#2c3e50">{{ storage_conditions }}</text>
      </g>
    </g>

    <!-- Right Column: Regulatory & Standards Compliance -->
    <g id="col_right" transform="translate(390, 0)">
      
      <!-- Sterilization & Caution Symbols Box -->
      <rect x="0" y="0" width="350" height="118" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1" rx="4"/>
      
      {% if sterilization_symbol %}
      <!-- ISO 15223-1 Sterilization Symbol -->
      <g id="symbol_sterile" transform="translate(15, 15)">
        <rect x="0" y="0" width="130" height="32" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
        <line x1="75" y1="0" x2="75" y2="32" stroke="#2c3e50" stroke-width="1.5"/>
        <text x="38" y="21" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">STERILE</text>
        <text x="102" y="21" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">EO</text>
      </g>
      {% endif %}

      <!-- Do Not Re-use Symbol (2) -->
      <g id="symbol_single_use" transform="translate(160, 15)">
        <circle cx="16" cy="16" r="15" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
        <line x1="5" y1="27" x2="27" y2="5" stroke="#2c3e50" stroke-width="2"/>
        <text x="16" y="22" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">2</text>
      </g>

      <!-- Consult Instructions for Use -->
      <g id="symbol_ifu" transform="translate(205, 15)">
        <rect x="0" y="0" width="32" height="32" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
        <text x="16" y="23" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">ℹ</text>
      </g>

      <!-- Caution Symbol -->
      <g id="symbol_caution" transform="translate(250, 15)">
        <polygon points="16,2 30,30 2,30" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
        <text x="16" y="25" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">!</text>
      </g>

      <!-- CE Mark or Rx Only Badge -->
      <g id="market_compliance" transform="translate(15, 60)">
        {% if ce_mark %}
        <text x="0" y="25" font-size="22" font-weight="bold" fill="#2c3e50">{{ ce_mark }}</text>
        <text x="95" y="24" font-size="10" fill="#7f8c8d">Notified Body: BSI 0123</text>
        {% else %}
        <rect x="0" y="5" width="80" height="24" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5" rx="3"/>
        <text x="40" y="22" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">Rx Only</text>
        <text x="90" y="22" font-size="10" fill="#7f8c8d">US Federal Law Restricted</text>
        {% endif %}
      </g>

      <!-- Manufacturer & Authorized Representative -->
      <g id="mfr_info" transform="translate(0, 128)">
        <rect x="0" y="0" width="350" height="54" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1" rx="4"/>
        <text x="15" y="20" font-size="10" font-weight="bold" fill="#7f8c8d">LEGAL MANUFACTURER</text>
        <text x="15" y="34" font-size="10" fill="#2c3e50">{{ manufacturer }}</text>
        {% if ec_rep %}
        <text x="15" y="47" font-size="9" fill="#16a085">EC REP: {{ ec_rep }}</text>
        {% endif %}
      </g>
    </g>
  </g>

  <!-- UDI & Barcode Footer Section -->
  <g id="udi_section" transform="translate(30, {% if is_draft %}370{% else %}335{% endif %})">
    <rect x="0" y="0" width="740" height="75" fill="#f1f2f6" stroke="#2c3e50" stroke-width="1.5" rx="4"/>
    
    <!-- Simulated 2D DataMatrix Grid -->
    <g id="datamatrix_graphic" transform="translate(15, 10)">
      <rect x="0" y="0" width="55" height="55" fill="#2c3e50"/>
      <line x1="2" y1="2" x2="2" y2="53" stroke="#ffffff" stroke-width="3"/>
      <line x1="2" y1="53" x2="53" y2="53" stroke="#ffffff" stroke-width="3"/>
      <rect x="8" y="8" width="8" height="8" fill="#ffffff"/>
      <rect x="24" y="8" width="8" height="8" fill="#ffffff"/>
      <rect x="40" y="8" width="8" height="8" fill="#ffffff"/>
      <rect x="16" y="16" width="8" height="8" fill="#ffffff"/>
      <rect x="32" y="16" width="8" height="8" fill="#ffffff"/>
      <rect x="8" y="24" width="8" height="8" fill="#ffffff"/>
      <rect x="24" y="32" width="8" height="8" fill="#ffffff"/>
      <rect x="40" y="32" width="8" height="8" fill="#ffffff"/>
      <rect x="16" y="40" width="8" height="8" fill="#ffffff"/>
    </g>

    <!-- Human Readable Interpretation (HRI) of UDI -->
    <text x="85" y="26" font-size="11" font-weight="bold" fill="#7f8c8d">UNIQUE DEVICE IDENTIFICATION (UDI) - HUMAN READABLE</text>
    <text x="85" y="45" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#2c3e50" id="field_udi_hri">{{ full_udi }}</text>
    <text x="85" y="62" font-size="10" fill="#7f8c8d">DI: (01){{ udi_di }} | PI: {{ udi_pi }}</text>

    <!-- Version & Metadata Anchor -->
    <text x="725" y="65" font-size="9" fill="#95a5a6" text-anchor="end">OmniLabel Rev: {{ revision }} | Tmpl: {{ template_version }} | Ref: {{ variant_id }}</text>
  </g>
</svg>
